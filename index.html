<!DOCTYPE html>
<html lang="cs" class="transition-colors duration-500">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Czech AI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-slate-900 dark:to-black min-h-screen p-5 transition-all duration-500 text-slate-900 dark:text-slate-100">

    <div class="max-w-md mx-auto flex justify-between items-center mb-8">
        <h1 class="text-2xl font-black tracking-tighter">SPECIAL AGENT</h1>
        <button onclick="toggleTheme()" class="glass p-2 rounded-full shadow-lg active:scale-95">
            <span id="theme-icon">🌓</span>
        </button>
    </div>

    <div class="max-w-md mx-auto glass rounded-3xl shadow-2xl p-8">
        <div class="space-y-4">
            <label class="text-xs font-bold uppercase tracking-widest opacity-60">Zadání (Unrestricted)</label>
            <input id="query" type="text" placeholder="Co mám vyhledat?..." 
                   class="w-full bg-white/50 dark:bg-black/20 p-4 rounded-2xl border-none ring-1 ring-black/5 dark:ring-white/10 outline-none">
            
            <button id="run-btn" onclick="runAgent()" 
                    class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition-all">
                Spustit Wasm Analýzu
            </button>
        </div>
        
        <div id="status" class="mt-6 text-center text-sm font-medium opacity-50 text-blue-500">Systém připraven</div>
        
        <div id="result" class="mt-8 hidden border-t border-black/5 dark:border-white/5 pt-6">
            <h2 id="res-title" class="font-bold text-xl mb-2 text-blue-600 dark:text-blue-400"></h2>
            <p id="res-summary" class="leading-relaxed opacity-80 italic"></p>
            <div id="res-meta" class="mt-6 p-3 bg-black/5 dark:bg-white/5 rounded-xl text-[10px] font-mono opacity-60"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
