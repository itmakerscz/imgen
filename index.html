<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>nevimto.cz | Dashboard</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" v-cloak>
    <div v-if="!activeChat" class="dashboard">
        <header>
            <div class="logo">nevimto<span>.cz</span></div>
            <div class="status-text">LOKÁLNÍ AI DASHBOARD</div>
        </header>
        
        <div class="grid">
            <div class="tile new-chat" @click="createNewChat">
                <div class="icon">+</div>
                <h3>Nový chat</h3>
                <p>Začít s čistým štítem</p>
            </div>

            <div v-for="chat in chatHistory" :key="chat.id" class="tile chat-tile" @click="loadChat(chat)">
                <div class="chat-info">
                    <h3>{{ chat.title || 'Rozhovor bez názvu' }}</h3>
                    <small>{{ formatDate(chat.createdAt) }}</small>
                </div>
                <button @click.stop="deleteChat(chat.id)" class="btn-delete">×</button>
            </div>
        </div>
    </div>

    <div v-else class="chat-interface">
        <aside class="sidebar">
            <button class="btn-back" @click="activeChat = null">← Zpět</button>
            <div class="sidebar-content">
                <h4>MOJE DATA (EN)</h4>
                <div class="source-list">
                    <div v-for="src in currentSources" :key="src.id" class="source-item">
                        {{ src.name }}
                    </div>
                </div>
                <button class="btn-add-data" @click="addSourcePrompt">+ Přidat data</button>
            </div>
        </aside>

        <main class="chat-main">
            <header>
                <div class="logo">{{ activeChat.title }}</div>
                <div class="status-dot" :class="{ 'is-ready': isReady }"></div>
            </header>

            <div class="chat-container" ref="chatBox">
                <div v-for="m in messages" :class="['msg', m.role]">
                    {{ m.content }}
                </div>
            </div>

            <footer>
                <div class="input-wrapper">
                    <input v-model="userInput" @keyup.enter="handleSend" placeholder="Ptejte se..." :disabled="!isReady">
                    <button @click="handleSend" :disabled="!isReady">🚀</button>
                </div>
            </footer>
        </main>
    </div>

    <div v-if="loading" class="loader-overlay">
        <div class="progress-bar"><div class="progress-fill" :style="{width: progress+'%'}"></div></div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
