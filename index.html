<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nevimto.cz | Local AI Agents</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="icon" href="#" type="image/x-icon">

    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/vue.global.js"></script>
</head>
<body>

<div id="app" v-cloak>
    <div v-if="!activeChatId" class="dashboard">
        <header class="header-main">
            <h1 class="logo">nevimto<span>.cz</span></h1>
            <p class="subtitle">Select an existing agent or start a new one.</p>
        </header>
        
        <div class="grid">
            <div class="tile create-new" @click="startNewAgent">
                <span class="plus-icon">+</span>
                <h3>Start New Agent</h3>
            </div>

            <div v-for="chat in chats" :key="chat.id" class="tile" @click="openChat(chat.id)">
                <div class="tile-content">
                    <h3>{{ chat.agentName }}</h3>
                    <p>{{ new Date(chat.createdAt).toLocaleDateString() }}</p>
                </div>
                <div class="tile-footer">Local Storage</div>
            </div>
        </div>
    </div>

    <div v-else class="app-container">
        <aside class="sidebar">
            <button class="btn btn-secondary back-btn" @click="loadDashboard">← Dashboard</button>
            
            <div class="sidebar-section">
                <h4>AGENT KNOWLEDGE</h4>
                <div class="source-container">
                    <div v-for="s in sources" :key="s.id" class="source-tag">
                        {{ s.title }}
                    </div>
                </div>
            </div>
            <button class="btn add-btn" @click="addKnowledge">+ Add English Data</button>
        </aside>

        <main class="main-chat">
            <div class="chat-window" ref="chatBox">
                <div v-for="m in messages" :class="['bubble', m.role]">
                    {{ m.content }}
                </div>
            </div>

            <footer class="input-area">
                <input 
                    v-model="userInput" 
                    @keyup.enter="sendMessage" 
                    placeholder="Type your message..." 
                    :disabled="!isReady"
                >
                <button class="btn send-btn" @click="sendMessage" :disabled="!isReady">Send</button>
            </footer>
        </main>
    </div>

    <div v-if="loading" class="status-overlay">
        <div class="loader-card">
            <div class="loader-header">
                <span>INITIALIZING WASM CORE</span>
                <span>{{ progress }}%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" :style="{ width: progress + '%' }"></div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
