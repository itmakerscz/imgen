<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotizujto AI Agent</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex items-center justify-center font-sans">

    <div class="max-w-md w-full glass rounded-3xl shadow-2xl p-6 border border-white/5">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black uppercase tracking-tighter text-blue-500">Robotizujto <span class="text-white text-xs opacity-50">Wasm v2</span></h1>
            <div id="pwa-status" class="text-[10px] bg-white/10 px-2 py-1 rounded-full opacity-50">Online</div>
        </div>

        <div class="space-y-4">
            <textarea id="user-input" rows="3" placeholder="Zeptejte se na automatizaci..." 
                class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 focus:ring-2 focus:ring-blue-500 outline-none text-sm resize-none"></textarea>
            
            <button id="send-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 font-bold rounded-2xl shadow-lg shadow-blue-900/20 active:scale-95 transition-all disabled:opacity-30">
                Spustit AI Analýzu
            </button>
        </div>

        <div id="status" class="mt-4 text-[9px] uppercase font-mono text-center text-blue-400 tracking-widest">Připraven k akci</div>

        <div id="result-area" class="mt-6 hidden border-t border-white/5 pt-4">
            <p id="response-text" class="text-sm leading-relaxed text-slate-300 italic"></p>
            <div class="mt-4 text-[8px] opacity-30 font-mono">Engine: WebAssembly (SmolLM2-135M)</div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
