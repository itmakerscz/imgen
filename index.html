<!DOCTYPE html>
<html lang="cs" class="transition-colors duration-500">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Czech AI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwinds configuration for 2026 glass effects
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    backdropBlur: { xs: '2px' }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-slate-900 dark:to-black min-h-screen p-5 transition-all duration-500 text-slate-900 dark:text-slate-100">

    <div class="max-w-md mx-auto flex justify-between items-center mb-8">
        <h1 class="text-2xl font-black tracking-tighter">AI AGENT</h1>
        
        <button onclick="toggleTheme()" class="glass p-2 rounded-full shadow-lg active:scale-95 transition-transform">
            <span id="theme-icon" class="text-xl">🌓</span>
        </button>
    </div>

    <div class="max-w-md mx-auto glass rounded-3xl shadow-2xl overflow-hidden p-8">
        <div class="space-y-4">
            <label class="text-xs font-bold uppercase tracking-widest opacity-60">Zadání úkolu</label>
            <input id="query" type="text" placeholder="Co mám vyhledat?..." 
                   class="w-full bg-white/50 dark:bg-black/20 p-4 rounded-2xl border-none ring-1 ring-black/5 dark:ring-white/10 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            
            <button onclick="runResearch()" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30 transition-all active:scale-95">
                Spustit Agenta
            </button>
        </div>
        
        <div id="status" class="mt-6 text-center text-sm font-medium opacity-50">Systém připraven</div>
        
        <div id="result" class="mt-8 hidden animate-in fade-in slide-in-from-bottom-4 duration-700">
            <div class="h-px bg-gradient-to-r from-transparent via-slate-400/20 to-transparent mb-6"></div>
            <h2 id="res-title" class="font-bold text-xl mb-2"></h2>
            <p id="res-summary" class="leading-relaxed opacity-80"></p>
            <div id="res-meta" class="mt-6 p-3 bg-black/5 dark:bg-white/5 rounded-xl text-[10px] font-mono tracking-tighter uppercase"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
