<!DOCTYPE html>
<html lang="cs" class="transition-colors duration-500">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="manifest" href="manifest.json">
    <title>AI Special Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { backdropBlur: { xs: '2px' } } }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Plynulý přechod barev pozadí */
        body { transition: background-color 0.5s ease, color 0.5s ease; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-slate-900 dark:to-black min-h-screen p-5 text-slate-900 dark:text-slate-100">

    <div class="max-w-md mx-auto flex justify-between items-center mb-8">
        <h1 class="text-2xl font-black tracking-tighter uppercase">Special Agent</h1>
        <button id="theme-toggle" class="glass p-3 rounded-full shadow-lg active:scale-90 transition-transform">
            <span id="theme-icon" class="text-xl">🌓</span>
        </button>
    </div>

    <div class="max-w-md mx-auto glass rounded-3xl shadow-2xl p-8">
        <div class="space-y-4">
            <label class="text-xs font-bold uppercase tracking-widest opacity-60">Zadání úkolu</label>
            <textarea id="query" rows="3" placeholder="Co mám v Wasm analyzovat?..." 
                   class="w-full bg-white/50 dark:bg-black/20 p-4 rounded-2xl border-none ring-1 ring-black/5 dark:ring-white/10 outline-none focus:ring-2 focus:ring-blue-500 transition-all resize-none"></textarea>
            
            <button id="run-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                Spustit Wasm Agenta
            </button>
        </div>
        
        <div id="status" class="mt-6 text-center text-xs font-mono opacity-70 text-blue-500 uppercase tracking-tighter">
            Systém připraven (WebGPU)
        </div>
        
        <div id="result-box" class="mt-8 hidden border-t border-black/5 dark:border-white/5 pt-6 animate-in fade-in duration-700">
            <h2 class="font-bold text-blue-600 dark:text-blue-400 text-sm uppercase mb-2">Výsledek analýzy:</h2>
            <p id="res-summary" class="leading-relaxed opacity-90 italic text-sm md:text-base"></p>
            <div id="res-meta" class="mt-6 p-3 bg-black/5 dark:bg-white/5 rounded-xl text-[10px] font-mono opacity-50 flex justify-between">
                <span>Llama-3.2-1B-q4</span>
                <span>WebGPU Active</span>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
