<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>nevimto.cz | AI Agents</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" v-cloak>
    <div v-if="!activeChatId" class="dashboard">
        <h1 style="font-weight: 900;">nevimto<span style="color:var(--accent)">.cz</span></h1>
        <p style="color:var(--text-muted)">Select an existing chat or start a new AI agent.</p>
        
        <div class="grid">
            <div class="tile create-new" @click="startNewAgent">
                <div style="font-size: 2rem;">+</div>
                <h3>Start New Agent</h3>
            </div>

            <div v-for="chat in chats" :key="chat.id" class="tile" @click="openChat(chat.id)">
                <div>
                    <h3>{{ chat.agentName }}</h3>
                    <p>{{ new Date(chat.createdAt).toLocaleDateString() }}</p>
                </div>
                <p style="font-size: 11px; opacity: 0.5;">Local Database Storage</p>
            </div>
        </div>
    </div>

    <div v-else class="app-container">
        <aside class="sidebar">
            <button class="btn btn-secondary" @click="loadDashboard" style="margin-bottom: 30px;">← Dashboard</button>
            
            <h4 style="font-size: 12px; color: var(--text-muted); letter-spacing: 1px;">AGENT KNOWLEDGE</h4>
            <div style="flex: 1; overflow-y: auto;">
                <div v-for="s in sources" :key="s.id" class="source-tag">
                    <span>{{ s.title }}</span>
                </div>
            </div>
            <button class="btn" @click="addKnowledge">+ Add English Data</button>
        </aside>

        <main class="main-chat">
            <div class="chat-window" ref="chatBox">
                <div v-for="m in messages" :class="['bubble', m.role === 'user' ? 'user' : 'ai']">
                    {{ m.content }}
                </div>
            </div>

            <footer class="input-area">
                <input v-model="userInput" @keyup.enter="sendMessage" placeholder="Type your message..." :disabled="!isReady">
                <button class="btn" @click="sendMessage" :disabled="!isReady">Send</button>
            </footer>
        </main>
    </div>

    <div v-if="loading" style="position:fixed; bottom: 20px; right: 20px; background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid var(--accent); z-index: 100;">
        <div style="font-size: 10px; margin-bottom: 5px;">LOADING GPU CORE: {{ progress }}%</div>
        <div style="width: 150px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px;">
            <div :style="{ width: progress + '%', background: 'var(--accent)', height: '100%' }"></div>
        </div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
