<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotizujto AI Agent</title>
    <link rel="shortcut icon" href="#">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col p-4 font-sans">

    <div class="max-w-2xl w-full mx-auto flex flex-col h-full glass rounded-3xl shadow-2xl overflow-hidden">
        <header class="p-4 border-b border-white/5 flex justify-between items-center bg-black/20">
            <h1 class="text-blue-500 font-black uppercase tracking-tighter">Robotizujto <span class="text-white opacity-50 text-xs">AI Wasm</span></h1>
            <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
        </header>

        <main id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 text-sm leading-relaxed"></main>

        <div id="progress-container" class="hidden px-6 py-2 bg-black/40">
            <div class="flex justify-between text-[10px] mb-1 font-mono text-blue-400 uppercase">
                <span id="progress-label">Stahuji model...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <footer class="p-4 border-t border-white/5 bg-black/20">
            <div class="flex gap-2">
                <input id="user-input" type="text" placeholder="Zeptejte se na automatizaci..." 
                    class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <button id="send-btn" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-bold transition-all disabled:opacity-30">
                    Odeslat
                </button>
            </div>
            <p id="status-text" class="text-[9px] mt-2 text-center opacity-40 uppercase font-mono tracking-widest text-blue-300">Inicializace...</p>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
