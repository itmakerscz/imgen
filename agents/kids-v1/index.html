<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBuddy AI</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
    {
        "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
            "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm"
        }
    }
    </script>
</head>
<body>

<div id="app" v-cloak>
    <div class="app-wrapper">
        <header>
            <h1>🌈 SafeBuddy</h1>
            <p class="status">{{ statusText }}</p>
        </header>

        <section class="setup-panel" v-if="!isEngineReady">
            <div class="card">
                <h3>Select a Brain</h3>
                <select v-model="selectedModel" :disabled="isLoading">
                    <option v-for="model in availableModels" :key="model.id" :value="model.id">
                        {{ model.name }}
                    </option>
                </select>
                <button @click="initAI" :disabled="isLoading" class="primary-btn">
                    {{ isLoading ? 'Setting up...' : 'Start Chatting' }}
                </button>
                <p class="help-text">First load takes 1-2 minutes to download the brain.</p>
            </div>
        </section>

        <main class="chat-display" ref="chatWindow">
            <div v-for="(msg, i) in chatHistory" :key="i" :class="['msg-wrapper', msg.role]">
                <div class="bubble">
                    <small>{{ msg.role === 'user' ? 'Me' : 'Buddy' }}</small>
                    <p>{{ msg.content }}</p>
                </div>
            </div>
            <div v-if="isTyping" class="msg-wrapper assistant">
                <div class="bubble typing">Buddy is thinking...</div>
            </div>
        </main>

        <footer class="input-bar">
            <input 
                v-model="userInput" 
                @keyup="handleKeyup"
                placeholder="Ask me anything safe..."
                :disabled="!isEngineReady || isTyping"
            >
            <button @click="sendMessage" :disabled="!isEngineReady || isTyping">Send</button>
        </footer>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
