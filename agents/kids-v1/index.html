<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeKid AI</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
    {
        "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
            "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm"
        }
    }
    </script>
</head>
<body>
    <div id="app" v-cloak>
        <div class="chat-container">
            <header>
                <h1>🌈 SafeBuddy</h1>
                <div class="status-indicator">{{ statusText }}</div>
            </header>
            <main class="chat-window" ref="chatWindow">
                <div v-for="(msg, i) in chatHistory" :key="i" :class="['message', msg.role]">
                    <div class="bubble">{{ msg.content }}</div>
                </div>
                <div v-if="isTyping" class="message assistant"><div class="bubble">...</div></div>
            </main>
            <footer>
                <div class="input-wrapper">
                    <input v-model="userInput" @keyup.enter="handleSend" placeholder="Type here..." :disabled="!isEngineReady">
                    <button @click="handleSend" :disabled="!isEngineReady">Send</button>
                </div>
            </footer>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
